<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моја Заштеда</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .card-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .card-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .balance-box {
            background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
        }

        .balance-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }

        .balance-currency {
            font-size: 18px;
            color: #667eea;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #777;
            font-size: 14px;
        }

        .info-value {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .footer {
            text-align: center;
            color: white;
            opacity: 0.7;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Моја Заштеда</h1>
            <p>Моја омилена продавница — секогаш за мене!</p>
        </div>

        <div class="card">
            <div class="card-title">Моја Картичка</div>
            <div class="card-subtitle">Број: #0001</div>

            <div class="balance-box">
                <div class="balance-label">💰 Моментална заштеда</div>
                <div class="balance-amount">0,00 <span class="balance-currency">ден</span></div>
            </div>

            <div class="info-row">
                <span class="info-label">Име</span>
                <span class="info-value">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Вкупно заштедено досега</span>
                <span class="info-value">0 ден</span>
            </div>
            <div class="info-row">
                <span class="info-label">Последна посета</span>
                <span class="info-value">---</span>
            </div>

            <button class="btn btn-primary" onclick="alert('Клиентот овде ќе ја скенира својата картичка!')">
                📲 Моја картичка
            </button>
            
            <button class="btn btn-secondary" onclick="alert('Најави се како продавач')">
                🏪 Најава за продавач
            </button>
        </div>

        <div class="footer">
            © 2026 Моја Заштеда. Сите права се задржани.
        </div>
    </div>
</body>
</html>
