<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Унија на Интелигенции</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: white;
            padding: 30px 20px 80px;
        }

        /* ГОРНО ПОЛЕ ЗА ПИШУВАЊЕ */
        .top-input-section {
            max-width: 600px;
            margin: 0 auto 50px;
            text-align: center;
        }
        .top-input-section h2 {
            font-size: 18px;
            color: #93c5fd;
            margin-bottom: 15px;
        }
        .input-box {
            width: 100%;
            min-height: 80px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(96, 165, 250, 0.4);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }
        .input-box:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.25);
        }
        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            padding: 10px 28px;
            color: white;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        .send-btn:hover {
            transform: scale(1.03);
        }
        .response-box {
            margin-top: 18px;
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid #10b981;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: none;
        }
        .response-box.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ЛИНИЈА ПОД ГОРНОТО ПОЛЕ */
        .vertical-line {
            width: 3px;
            height: 30px;
            background: linear-gradient(180deg, #60a5fa, #3b82f6);
            margin: 0 auto;
            border-radius: 2px;
        }

        /* ЗАЕДНИЧКО ЗА МОЗОЦИТЕ */
        .brain-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }
        .brain-title {
            font-size: 14px;
            color: #93c5fd;
            margin-bottom: 10px;
        }
        .brain-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }
        .brain-circle {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #1e40af, #1e3a8a);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.35);
            z-index: 2;
            position: relative;
        }
        .brain-circle span {
            font-size: 36px;
        }
        .brain-name {
            font-size: 12px;
            margin-top: 4px;
            color: #bfdbfe;
            font-weight: 500;
        }
        .orbit-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .node {
            position: absolute;
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node:hover {
            transform: scale(1.08);
        }
        .node.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }
        .node span:first-child {
            font-size: 22px;
        }
        .node span:last-child {
            font-size: 9px;
            margin-top: 2px;
            opacity: 0.8;
        }

        /* ВРСКА ПОМЕЃУ ДВА МОЗОКА */
        .connection-line {
            width: 3px;
            height: 60px;
            background: linear-gradient(180deg, #3b82f6, #10b981);
            margin: 0 auto;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }
        .connection-label {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <!-- ГОРНО ПОЛЕ ЗА ПИШУВАЊЕ -->
    <div class="top-input-section">
        <h2>💬 Внеси го твојот барање</h2>
        <textarea class="input-box" id="userInput" placeholder="Напиши што сакаш да се направи..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Испрати ↗</button>
        <div class="response-box" id="responseBox">
            <strong>📨 Одговор:</strong><br><br>
            <span id="responseText">Се обработува...</span>
        </div>
    </div>

    <!-- ЛИНИЈА КОН ГОРНИОТ МОЗОК -->
    <div class="vertical-line"></div>

    <!-- 🧠 ГОРЕН МОЗОК = ВЕШТАЧКИ ИНТЕЛИГЕНЦИИ -->
    <div class="brain-section">
        <div class="brain-title">🧠 Избери вештачка интелигенција</div>
        <div class="brain-wrapper">
            <div class="brain-circle">
                <span>🧠</span>
                <div class="brain-name">АИ ЦЕНТАР</div>
            </div>
            <div class="orbit-ring">
                <!-- Вештачки интелигенции -->
                <div class="node" style="top: -20px; left: 50%; transform: translateX(-50%);" onclick="toggleNode(this)">
                    <span>🤖</span><span>GPT</span>
                </div>
                <div class="node" style="top: 25px; right: 0;" onclick="toggleNode(this)">
                    <span>✨</span><span>Gemini</span>
                </div>
                <div class="node" style="bottom: 25px; right: 0;" onclick="toggleNode(this)">
                    <span>🦉</span><span>Claude</span>
                </div>
                <div class="node" style="bottom: -20px; left: 50%; transform: translateX(-50%);" onclick="toggleNode(this)">
                    <span>🧩</span><span>Perplexity</span>
                </div>
                <div class="node" style="bottom: 25px; left: 0;" onclick="toggleNode(this)">
                    <span>🔮</span><span>DeepSeek</span>
                </div>
                <div class="node" style="top: 25px; left: 0;" onclick="toggleNode(this)">
                    <span>💡</span><span>Друга АИ</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ВРСКА ПОМЕЃУ ДВА МОЗОКА -->
    <div class="connection-label">▼ Поврзано со ▼</div>
    <div class="connection-line"></div>

    <!-- 🧠 ДОЛЕН МОЗОК = ТВОИТЕ АЛАТКИ / ПЛАТФОРМИ -->
    <div class="brain-section">
        <div class="brain-title">🔗 Избери каде да се испрати</div>
        <div class="brain-wrapper">
            <div class="brain-circle" style="background: radial-gradient(circle, #059669, #047857);">
                <span>🔗</span>
                <div class="brain-name">АЛАТКИ</div>
            </div>
            <div class="orbit-ring">
                <!-- Твоите платформи и алатки -->
                <div class="node" style="top: -20px; left: 50%; transform: translateX(-50%);" onclick="toggleNode(this)">
                    <span>📘</span><span>Facebook</span>
                </div>
                <div class="node" style="top: 25px; right: 0;" onclick="toggleNode(this)">
                    <span>📱</span><span>Viber</span>
                </div>
                <div class="node" style="bottom: 25px; right: 0;" onclick="toggleNode(this)">
                    <span>📧</span><span>Email</span>
                </div>
                <div class="node" style="bottom: -20px; left: 50%; transform: translateX(-50%);" onclick="toggleNode(this)">
                    <span>🎬</span><span>YouTube</span>
                </div>
                <div class="node" style="bottom: 25px; left: 0;" onclick="toggleNode(this)">
                    <span>🐙</span><span>GitHub</span>
                </div>
                <div class="node" style="top: 25px; left: 0;" onclick="toggleNode(this)">
                    <span>💬</span><span>Telegram</span>
                </div>
                <div class="node" style="right: -25px; top: 50%; transform: translateY(-50%);" onclick="toggleNode(this)">
                    <span>🌐</span><span>Веб</span>
                </div>
                <div class="node" style="left: -25px; top: 50%; transform: translateY(-50%);" onclick="toggleNode(this)">
                    <span>📁</span><span>Датотеки</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('Напиши што сакаш да се направи!');
                return;
            }

            const selectedAI = document.querySelectorAll('.brain-section:first-child .node.selected');
            const selectedTools = document.querySelectorAll('.brain-section:last-child .node.selected');

            let aiNames = selectedAI.length > 0 
                ? Array.from(selectedAI).map(n => n.querySelector('span:last-child').textContent).join(', ')
                : 'ниедна АИ не е избрана';
            
            let toolNames = selectedTools.length > 0
                ? Array.from(selectedTools).map(n => n.querySelector('span:last-child').textContent).join(', ')
                : 'ниедна платформа не е избрана';

            const box = document.getElementById('responseBox');
            box.classList.add('show');
            document.getElementById('responseText').innerHTML = 
                '<strong>📝 Твојот барање:</strong> "' + message + '"<br><br>' +
                '<strong>🧠 Избрана АИ:</strong> ' + aiNames + '<br>' +
                '<strong>🔗 Избрани алатки:</strong> ' + toolNames + '<br><br>' +
                '✅ Подготвено! Кога ќе се поврзат сервисите, овде ќе се изврши автоматски.';
        }

        function toggleNode(node) {
            // Ако е од горниот мозок — дозволи само една избрана АИ
            const parentSection = node.closest('.brain-section');
            if (parentSection.querySelector('.brain-name').textContent.includes('АИ')) {
                // Одизбери ги сите прво
                parentSection.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            }
            node.classList.toggle('selected');
        }
    </script>

</body>
</html>
