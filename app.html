<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Унија на Интелигенции — Центар</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ГОРЕН ДЕЛ — ЗА ПИШУВАЊЕ */
        .top-section {
            max-width: 800px;
            margin: 0 auto 60px;
            text-align: center;
        }
        .top-section h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #60a5fa;
        }
        .input-box {
            width: 100%;
            min-height: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 15px;
            outline: none;
        }
        .input-box:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.2);
        }
        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            padding: 12px 30px;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .send-btn:hover {
            transform: scale(1.05);
        }
        .response-box {
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            display: none;
            border-left: 3px solid #10b981;
        }
        .response-box.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* СРЕДИНА — МОЗОК */
        .center-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 40px 0 80px;
        }
        .brain {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #1e40af, #1e3a8a);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            z-index: 10;
        }
        .brain-icon {
            font-size: 40px;
        }
        .brain-text {
            font-weight: bold;
            font-size: 14px;
            margin-top: 5px;
        }
        .code-ring {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 2px dashed rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            animation: spin 20s linear infinite;
            display: none;
        }
        .code-ring.active {
            display: block;
        }
        .code-ring span {
            position: absolute;
            font-size: 10px;
            color: #60a5fa;
            font-family: monospace;
        }
        .code-ring span:nth-child(1) { top: 5px; left: 50%; transform: translateX(-50%); }
        .code-ring span:nth-child(2) { right: 10px; top: 50%; transform: translateY(-50%); }
        .code-ring span:nth-child(3) { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .code-ring span:nth-child(4) { left: 10px; top: 50%; transform: translateY(-50%); }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ЛИНИИ И ПЛАТФОРМИ */
        .platforms-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        .lines-bg {
            position: absolute;
            top: -80px;
            left: 50%;
            width: 100%;
            height: 160px;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 2;
        }
        .platform-card {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .platform-card:hover {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            transform: translateY(-5px);
        }
        .platform-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        .platform-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }
        .platform-name {
            font-size: 13px;
            opacity: 0.8;
        }
        .add-card {
            border-style: dashed;
            border-color: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .add-icon {
            font-size: 24px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- ГОРЕН ДЕЛ — ПИШУВАЊЕ И ОДГОВОРИ -->
    <div class="top-section">
        <h1>💬 Разговарај со Центарот</h1>
        <textarea class="input-box" id="userInput" placeholder="Напиши што сакаш да се случи..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Испрати ↗</button>
        
        <div class="response-box" id="responseBox">
            <strong>📨 Одговор:</strong><br><br>
            <span id="responseText">Ова е пример одговор. Ќе го поврземе со вистински АИ подоцна!</span>
        </div>
    </div>

    <!-- СРЕДИНА — МОЗОК СО КОДОВИ КРУЖАТ -->
    <div class="center-container">
        <div class="code-ring" id="codeRing">
            <span>{...}</span>
            <span>async</span>
            <span>JSON</span>
            <span>API→</span>
        </div>
        <div class="brain" id="brain">
            <div class="brain-icon">🧠</div>
            <div class="brain-text">МОЗОК</div>
        </div>
    </div>

    <!-- ДОЛЕН ДЕЛ — ПЛАТФОРМИ СО ЛИНИИ -->
    <div class="platforms-container">
        <div class="platforms-grid">
            <div class="platform-card" onclick="togglePlatform(this)">
                <div class="platform-icon">📧</div>
                <div class="platform-name">Email</div>
            </div>
            <div class="platform-card" onclick="togglePlatform(this)">
                <div class="platform-icon">📱</div>
                <div class="platform-name">Viber</div>
            </div>
            <div class="platform-card" onclick="togglePlatform(this)">
                <div class="platform-icon">📘</div>
                <div class="platform-name">Facebook</div>
            </div>
            <div class="platform-card" onclick="togglePlatform(this)">
                <div class="platform-icon">🎬</div>
                <div class="platform-name">YouTube</div>
            </div>
            <div class="platform-card" onclick="togglePlatform(this)">
                <div class="platform-icon">🐙</div>
                <div class="platform-name">GitHub</div>
            </div>
            <div class="platform-card add-card" title="Додај нова платформа">
                <div class="add-icon">+</div>
            </div>
        </div>
    </div>

    <script>
        // Кога корисникот прати порака
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('Напиши порака прво!');
                return;
            }

            // Пушти ги кодовите да кружат
            document.getElementById('codeRing').classList.add('active');
            
            // Прикажи одговор по 1.5 секунди
            setTimeout(() => {
                const responseBox = document.getElementById('responseBox');
                responseBox.classList.add('show');
                document.getElementById('responseText').textContent = 
                    „Ја примив твојата порака: „“ + message + „“\n\nСистемот ги обработува податоците...\n\n✅ Подготвено! Одбери платформа од долу каде сакаш да се испрати резултатот.“;
                
                // Запри ги кодовите по 5 секунди
                setTimeout(() => {
                    document.getElementById('codeRing').classList.remove('active');
                }, 5000);
            }, 1500);
        }

        // Избирање/одбирање платформи
        function togglePlatform(card) {
            card.classList.toggle('selected');
        }
    </script>

</body>
</html>
